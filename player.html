<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join | Mind Games</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><main class="shell"><header><a class="logo" href="index.html" style="color:inherit;text-decoration:none">🧠 MIND GAMES</a><span class="tag">PLAYER</span></header>
<section class="card" id="join"><h2>Join a game</h2><label class="field">Your nickname<input id="name" maxlength="24" placeholder="Enter your name"></label><label class="field">6-digit Game PIN<input id="pin" inputmode="numeric" maxlength="6" placeholder="123456"></label><button id="joinBtn">Join game</button><div class="status" id="msg"></div></section>
<section class="card hidden" id="play"><p class="eyebrow" id="state">CONNECTED</p><h2 id="welcome"></h2><div id="questionArea"><p class="muted">Waiting for the host to start…</p></div><p class="status" id="feedback"></p><h2>Your score: <span id="score">0</span></h2><h2>Leaderboard</h2><ol class="leader" id="board"></ol></section></main>
<script>
const $=id=>document.getElementById(id);let db,player,gamePin,seen=-1,timer,answered=false;
function init(){const c=window.MIND_GAMES_CONFIG||{};if(!c.SUPABASE_URL||c.SUPABASE_URL.includes('PASTE_')||!c.SUPABASE_ANON_KEY||c.SUPABASE_ANON_KEY.includes('PASTE_'))throw Error('Open config.js and add your Supabase Project URL and anon key first.');db=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY)}
$('joinBtn').onclick=async()=>{try{init();gamePin=$('pin').value.trim();const name=$('name').value.trim();if(!name||!/^\d{6}$/.test(gamePin))throw Error('Enter your nickname and a valid 6-digit PIN.');$('msg').textContent='Joining…';const {data:g,error}=await db.from('games').select('*').eq('pin',gamePin).single();if(error||!g)throw Error('Game PIN not found. Check the PIN and try again.');if(g.status==='finished')throw Error('This game has already finished.');const {data:p,error:pe}=await db.from('players').insert({game_pin:gamePin,name}).select().single();if(pe)throw pe;player=p;$('join').classList.add('hidden');$('play').classList.remove('hidden');$('welcome').textContent='Welcome, '+name+'!';await refresh();timer=setInterval(refresh,1800)}catch(e){$('msg').textContent=e.message||'Could not join game.'}};
async function refresh(){const {data:g,error}=await db.from('games').select('*').eq('pin',gamePin).single();if(error||!g)return;const {data:ps}=await db.from('players').select('*').eq('game_pin',gamePin).order('score',{ascending:false});player=ps.find(p=>p.id===player.id)||player;$('score').textContent=player.score;$('board').innerHTML=(ps||[]).map(p=>`<li>${esc(p.name)} <b>${p.score}</b></li>`).join('');if(g.status==='finished'){$('state').textContent='GAME FINISHED';$('questionArea').innerHTML='<h2>Great game!</h2><p class="muted">The host has ended the quiz. Check the final leaderboard.</p>';return}if(g.status==='waiting'){$('state').textContent='WAITING FOR HOST';$('questionArea').innerHTML='<p class="muted">You are in! Wait for the host to start the quiz.</p>';return}const idx=g.current_question;if(idx!==seen){seen=idx;answered=(player.answers||[]).some(a=>a.index===idx);renderQuestion(g.questions[idx],idx)}else if(answered&&$('questionArea').dataset.done!=='yes')$('questionArea').dataset.done='yes'}
function renderQuestion(q,idx){$('state').textContent=`QUESTION ${idx+1}`;$('questionArea').dataset.done='no';$('questionArea').innerHTML=`<div class="question">${esc(q.question)}</div><div class="answers">${q.answers.map((a,i)=>`<button class="answer" data-i="${i}" ${answered?'disabled':''}>${esc(a)}</button>`).join('')}</div>${answered?'<p class="muted">Answer submitted. Waiting for next question…</p>':''}`;document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>submit(Number(b.dataset.i),q,idx))}
async function submit(choice,q,idx){if(answered)return;answered=true;const correct=choice===q.correct;const updated=[...(player.answers||[]),{index:idx,choice,correct}];const {data,error}=await db.from('players').update({score:player.score+(correct?100:0),answers:updated}).eq('id',player.id).select().single();if(error){$('feedback').textContent=error.message;return}player=data;$('feedback').textContent=correct?'Correct! +100 points':'Not quite — keep going!';renderQuestion(q,idx)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
