<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Host | Mind Games</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><main class="shell"><header><a class="logo" href="index.html" style="color:inherit;text-decoration:none">🧠 MIND GAMES</a><span class="tag">HOST PANEL</span></header>
<section class="card" id="setup"><h2>Create your quiz</h2><label class="field">Host name<input id="hostName" value="Quiz Host" maxlength="30"></label><p class="small">Add questions below. Each question needs four choices and the correct answer number (1–4).</p><div id="questions"></div><button class="secondary" id="addQ" type="button">+ Add question</button><p><button id="create" type="button">Create Game PIN</button></p><div class="status" id="msg"></div></section>
<section class="card hidden" id="lobby"><p class="eyebrow">SHARE THIS PIN WITH PLAYERS</p><div class="pin" id="pin"></div><p class="muted">Players can join at this website using the PIN above.</p><h2>Players <span id="count">0</span></h2><ul class="leader" id="players"></ul><div class="row"><button id="start">Start quiz</button><button class="secondary" id="finish">Finish game</button></div><div id="live" class="card hidden"><p class="eyebrow" id="qnum"></p><div class="question" id="qtext"></div><p class="small" id="answered"></p><button id="next">Next question</button></div><h2>Leaderboard</h2><ol class="leader" id="board"></ol><div class="status" id="hostMsg"></div></section></main>
<script>
const $=id=>document.getElementById(id);let db,game,questions=[],timer;
function setupDB(){const c=window.MIND_GAMES_CONFIG||{};if(!c.SUPABASE_URL||c.SUPABASE_URL.includes("PASTE_")||!c.SUPABASE_ANON_KEY||c.SUPABASE_ANON_KEY.includes("PASTE_"))throw Error("Open config.js and add your Supabase Project URL and anon key first.");db=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY)}
function addQuestion(){const n=questions.length+1;const wrap=document.createElement('div');wrap.className='card';wrap.innerHTML=`<h3>Question ${n}</h3><label class="field">Question<input class="q" placeholder="Type your question"></label><div class="row">${[1,2,3,4].map((x)=>`<label class="field">Choice ${x}<input class="a" placeholder="Choice ${x}"></label>`).join('')}</div><label class="field">Correct choice<select class="correct"><option value="0">1</option><option value="1">2</option><option value="2">3</option><option value="3">4</option></select></label>`;$('questions').appendChild(wrap);questions.push(wrap)}
$('addQ').onclick=addQuestion;addQuestion();addQuestion();
function makePin(){return String(Math.floor(100000+Math.random()*900000))}
$('create').onclick=async()=>{try{setupDB();const qs=[...document.querySelectorAll('#questions .card')].map(el=>({question:el.querySelector('.q').value.trim(),answers:[...el.querySelectorAll('.a')].map(x=>x.value.trim()),correct:Number(el.querySelector('.correct').value)}));if(qs.some(q=>!q.question||q.answers.some(a=>!a)))throw Error("Complete every question and all four choices.");if(qs.length<1)throw Error("Add at least one question.");$('msg').textContent='Creating game…';let result;for(let i=0;i<5;i++){result=await db.from('games').insert({pin:makePin(),host_name:$('hostName').value.trim()||'Host',questions:qs}).select().single();if(!result.error)break}if(result.error)throw result.error;game=result.data;$('pin').textContent=game.pin;$('setup').classList.add('hidden');$('lobby').classList.remove('hidden');await refresh();timer=setInterval(refresh,2500)}catch(e){$('msg').textContent=e.message||'Something went wrong.'}};
async function refresh(){if(!game)return;const {data:ps,error}=await db.from('players').select('*').eq('game_pin',game.pin).order('score',{ascending:false});if(error){$('hostMsg').textContent=error.message;return} $('count').textContent=ps.length;$('players').innerHTML=ps.map(p=>`<li>${esc(p.name)} <span>${p.score} pts</span></li>`).join('')||'<li>Waiting for players…</li>';$('board').innerHTML=ps.map(p=>`<li>${esc(p.name)} <b>${p.score}</b></li>`).join('');const {data:g}=await db.from('games').select('*').eq('pin',game.pin).single();if(g){game=g;if(g.status==='active'){const q=g.questions[g.current_question];$('live').classList.remove('hidden');$('qnum').textContent=`QUESTION ${g.current_question+1} OF ${g.questions.length}`;$('qtext').textContent=q.question;$('answered').textContent=`${ps.filter(p=>(p.answers||[]).some(a=>a.index===g.current_question)).length} player(s) answered`;$('next').textContent=g.current_question===g.questions.length-1?'Show results':'Next question'}else $('live').classList.add('hidden')}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('start').onclick=async()=>{await db.from('games').update({status:'active',current_question:0}).eq('pin',game.pin);await refresh()};
$('next').onclick=async()=>{let n=game.current_question+1;if(n>=game.questions.length){await db.from('games').update({status:'finished'}).eq('pin',game.pin);$('hostMsg').textContent='Quiz finished! Final scores are shown below.'}else await db.from('games').update({current_question:n}).eq('pin',game.pin);await refresh()};
$('finish').onclick=async()=>{await db.from('games').update({status:'finished'}).eq('pin',game.pin);$('hostMsg').textContent='Game finished.';await refresh()};
</script></body></html>
